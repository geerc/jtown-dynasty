baseURL = "https://jtown-dynasty.netlify.app/"  # update after Netlify gives you URL
title = "Jtown Dynasty"
languageCode = "en-us"
theme = "papermod"
paginations.papersize = 10
enableRobotsTXT = true
# If you use SCSS, make sure Hugo Extended is used (Netlify needs Extended)
# PaperMod recommends placing your static files under /static and content in /content

[params.author]
  name = "Christian Geer"

[params]
  mainSections = ["power_rankings"]
  # PaperMod parameters (feel free to tweak)
  subtitle = "Power Rankings & Fantasy Football"
  showReadingTime = true
  dateForm = "Jan 2, 2006"
  # theme-color, social links, analytics etc.:
  github = "geerc"
  # enable RSS
  rss = true

[[menu.main]]
  name = "Reports"
  url = "/power_rankings/"
  weight = 10

[[menu.main]]
  name = "Archive"
  url = "/archive/"
  weight = 20

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 30
