pages:
  generators:
    10: Cecil\Generator\DefaultPages
    20: Cecil\Generator\VirtualPages
    30: Cecil\Generator\ExternalBody
    40: Cecil\Generator\Section
    50: Cecil\Generator\Taxonomy
    60: Cecil\Generator\Homepage
    70: Cecil\Generator\Pagination
    80: Cecil\Generator\Alias
    90: Cecil\Generator\Redirect
  default:
    index:
      path: ''
      title: Home
      published: true
    404:
      path: '404'
      title: 'Page not found'
      layout: '404'
      uglyurl: true
      published: true
      excluded: true
    robots:
      path: robots
      title: Robots.txt
      layout: robots
      output: txt
      published: true
      excluded: true
      multilingual: false
    sitemap:
      path: sitemap
      title: 'XML sitemap'
      layout: sitemap
      output: xml
      changefreq: monthly
      priority: '0.5'
      published: true
      excluded: true
      multilingual: false
    xsl/atom:
      path: xsl/atom
      layout: feed
      output: xsl
      uglyurl: true
      published: true
      excluded: true
    xsl/rss:
      path: xsl/rss
      layout: feed
      output: xsl
      uglyurl: true
      published: false
      excluded: true
    path: /
    pagination:
      max: 10
      path: page
    redirects:
      path: _redirects
      output: netlify_redirects
      multilingual: false
      serviceworker:
        precache: false
    output:
      formats:
        -
          name: netlify_redirects
          mediatype: text/plain
          extension: ''
    admin:
      path: admin
      title: 'Content Manager (Netlify CMS)'
      layout: admin/index
      output: html
  netlify:
    cms:
      path: admin
      version: latest
    identity:
      version: v1
  serviceworker:
    ignore:
      -
        name: cms
        path: /admin
      -
        name: netlify
        path: /.netlify
output:
  formats:
    -
      name: html
      mediatype: text/html
      filename: index
      extension: html
    -
      name: atom
      mediatype: application/atom+xml
      filename: atom
      extension: xml
      exclude:
        - redirect
        - paginated
    -
      name: rss
      mediatype: application/rss+xml
      filename: rss
      extension: xml
      exclude:
        - redirect
        - paginated
    -
      name: json
      mediatype: application/json
      extension: json
      exclude:
        - redirect
    -
      name: xml
      mediatype: application/xml
      extension: xml
      exclude:
        - redirect
    -
      name: txt
      mediatype: text/plain
      extension: txt
      exclude:
        - redirect
    -
      name: amp
      mediatype: text/html
      subpath: amp
      filename: index
      extension: html
    -
      name: js
      mediatype: application/javascript
      extension: js
    -
      name: webmanifest
      mediatype: application/manifest+json
      extension: webmanifest
    -
      name: xsl
      mediatype: application/xml
      extension: xsl
    -
      name: jsonfeed
      mediatype: application/json
      filename: feed
      extension: json
      exclude:
        - redirect
        - paginated
    -
      name: oembed
      mediatype: application/json+oembed
      filename: oembed
      extension: json
      exclude:
        - redirect
        - paginated
    -
      name: embed
      mediatype: text/html
      filename: embed
      extension: html
      exclude:
        - redirect
        - paginated
  postprocessors:
    GeneratorMetaTag: Cecil\Renderer\PostProcessor\GeneratorMetaTag
    HtmlExcerpt: Cecil\Renderer\PostProcessor\HtmlExcerpt
    MarkdownLink: Cecil\Renderer\PostProcessor\MarkdownLink
title: 'Jtown Dynasty'
baseline: "Jenkintown's Finest"
description: 'THE fantasy football league of Jenkintown'
baseurl: 'https://jtowndynasty.netlify.app'
canonicalurl: true
keywords:
  - Cecil
  - 'Static Site Generator'
  - SSG
author: 'Christian Geer'
date:
  format: 'F j, Y'
  timezone: America/New_York
theme:
  - hyde
  - netlify
  - netlify-cms
hyde:
  sidebar:
    sticky: true
  theme: cecil
  reverse: false
googleanalytics: G-C4NCZ7X3VK
menus:
  footer:
    -
      id: author
      name: 'The author'
      url: 'https://arnaudligny.fr'
      weight: 99
