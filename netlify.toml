[build]
  publish = "public"
  command = "hugo --minify"

[build.environment]
  HUGO_VERSION = "0.151.0"

[context.production.environment]
  HUGO_VERSION = "0.151.0"  # latest stable as of now
  HUGO_ENV = "production"

# Build preview links against the unique Netlify preview host. Without this,
# Hugo uses the production baseURL from config.toml and unpublished reports
# link back to production, where they return 404 until merged.
[context.deploy-preview]
  command = "hugo --minify --baseURL \"$DEPLOY_PRIME_URL\""

[context.branch-deploy]
  command = "hugo --minify --baseURL \"$DEPLOY_PRIME_URL\""
