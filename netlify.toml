[build]
  # Install PHP dependencies, then run your build script
  command = "composer install --no-dev --prefer-dist && chmod +x .netlify/build.sh && bash .netlify/build.sh"
  # The folder that Cecil outputs to
  publish = "_site"
  environment = { PHP_VERSION = "8.2", CECIL_VERSION = "5.36.0" }

[context.deploy-preview]
  command = "chmod +x .netlify/build.sh && bash .netlify/build.sh preview"

[context.branch-deploy]
  command = "chmod +x .netlify/build.sh && bash .netlify/build.sh preview"

[template.environment]
  CECIL_TITLE = "Blog's title"
  CECIL_BASELINE = "Short description (~ 20 characters)"
  CECIL_DESCRIPTION = "Full description (~ 250 characters)"
  CECIL_AUTHOR = "Your name"
  CECIL_THEME = "Theme (use 'hyde' or 'garth')"
